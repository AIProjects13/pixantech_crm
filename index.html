<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--CSP-->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="color-scheme" content="light dark">
  <title>Pixantech CRM</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    /* Crítico inline (~1 KB): pinta el splash al instante, con el tema del sistema. */
    :root{--bg:#F5F6FA;--ink:#0F172A;--accent:#2F5FE0;--muted:#566377}
    @media (prefers-color-scheme:dark){:root{--bg:#0F1115;--ink:#E7E9EE;--accent:#5B8CFF;--muted:#9AA3B2}}
    :root[data-theme="light"]{--bg:#F5F6FA;--ink:#0F172A;--accent:#2F5FE0;--muted:#566377}
    :root[data-theme="dark"]{--bg:#0F1115;--ink:#E7E9EE;--accent:#5B8CFF;--muted:#9AA3B2}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    #splash{position:fixed;inset:0;display:grid;place-items:center;z-index:100;background:var(--bg);transition:opacity .35s ease,visibility .35s}
    #splash.hide{opacity:0;visibility:hidden}
    .sp-logo{width:64px;height:64px;border-radius:18px;background:var(--accent);display:grid;place-items:center;animation:sp-pulse 1.4s ease-in-out infinite}
    .sp-logo svg{width:30px;height:30px;color:#fff}
    .sp-bar{margin-top:20px;width:120px;height:3px;border-radius:3px;background:color-mix(in srgb,var(--accent) 18%,transparent);overflow:hidden}
    .sp-bar i{display:block;width:40%;height:100%;background:var(--accent);border-radius:3px;animation:sp-load 1.1s ease-in-out infinite}
    .sp-msg{margin-top:12px;font-size:13px;color:var(--muted)}
    @keyframes sp-pulse{50%{transform:scale(.92)}}
    @keyframes sp-load{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
    @media (prefers-reduced-motion:reduce){.sp-logo,.sp-bar i{animation:none}}
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <div style="display:flex;flex-direction:column;align-items:center">
      <div class="sp-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </div>
      <div class="sp-bar" aria-hidden="true"><i></i></div>
      <div class="sp-msg" id="splashMsg">Cargando Pixantech CRM…</div>
    </div>
  </div>
  <div id="root"></div>
  <div id="modalRoot"></div>
  <div id="toasts" class="toast-wrap" aria-live="polite"></div>
  <div id="toastsAlert" class="sr-only" aria-live="assertive"></div>
  <noscript>Activa JavaScript para usar Pixantech CRM.</noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
