<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pixantech CRM</title>
  <meta name="theme-color" content="#16235e">
  <link rel="icon" type="image/png" href="assets/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.5"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] } } },
    };
    // Tema guardado, antes de pintar nada (evita el parpadeo).
    try {
      var t = localStorage.getItem('pxt-theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    } catch (e) { /* sin almacenamiento */ }
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="min-h-full">

  <!-- Arranque -->
  <div id="boot" class="min-h-screen grid place-items-center">
    <div class="flex flex-col items-center gap-4">
      <div class="w-16 h-16 rounded-2xl grid place-items-center" style="background:linear-gradient(135deg,#16235e,#0e1744)"><img src="assets/pixan-emblem-sm.png" alt="" class="w-11 h-11 object-contain"></div>
      <div class="flex items-center gap-2 muted text-sm font-semibold"><i class="fa-solid fa-circle-notch fa-spin"></i> <span id="bootMsg">Cargando…</span></div>
    </div>
  </div>

  <!-- Acceso -->
  <section id="login" class="min-h-screen grid place-items-center px-4" hidden>
    <div class="glass w-full max-w-md p-8 fade-in">
      <div class="flex items-center gap-3 mb-8">
        <div class="w-12 h-12 rounded-2xl grid place-items-center flex-none" style="background:linear-gradient(135deg,#16235e,#0e1744)"><img src="assets/pixan-emblem-sm.png" alt="" class="w-9 h-9 object-contain"></div>
        <div>
          <h1 class="text-xl font-extrabold tracking-tight">Pixantech CRM</h1>
          <p class="text-sm muted">Ingresa con tu cuenta autorizada</p>
        </div>
      </div>
      <form id="loginForm" class="space-y-4" autocomplete="on">
        <div>
          <label class="label" for="lgEmail">Email</label>
          <input id="lgEmail" type="email" class="input" required autocomplete="username" placeholder="tu@empresa.com">
        </div>
        <div>
          <label class="label" for="lgPass">Contraseña</label>
          <div class="relative">
            <input id="lgPass" type="password" class="input pr-10" required autocomplete="current-password" placeholder="••••••••">
            <button type="button" id="lgShow" class="absolute right-2 top-1/2 -translate-y-1/2 muted px-2" aria-label="Mostrar contraseña"><span id="lgShowIc"></span></button>
          </div>
        </div>
        <div id="lgMsg" class="text-sm rounded-xl px-3 py-2" hidden></div>
        <button id="lgBtn" class="btn btn-primary w-full py-3" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Ingresar</button>
        <button type="button" id="lgForgot" class="w-full text-sm font-semibold muted hover:underline">¿Olvidaste tu contraseña?</button>
      </form>
      <div id="gate" class="space-y-4" hidden>
        <div id="gateMsg" class="text-sm rounded-xl px-4 py-3"></div>
        <div class="flex gap-2">
          <button id="gateVerify" class="btn btn-primary flex-1" hidden><i class="fa-solid fa-envelope-circle-check"></i> Reenviar verificación</button>
          <button id="gateRetry" class="btn btn-ghost flex-1"><i class="fa-solid fa-rotate"></i> Reintentar</button>
          <button id="gateOut" class="btn btn-ghost flex-1"><i class="fa-solid fa-arrow-right-from-bracket"></i> Salir</button>
        </div>
      </div>
      <p class="text-xs muted mt-8 text-center">Las cuentas las crea el administrador.</p>
    </div>
  </section>

  <!-- Aplicación -->
  <div id="app" hidden>
    <aside id="rail" class="rail is-mini" aria-label="Menú principal">
      <div class="rail-brand"><img src="assets/pixan-emblem-sm.png" alt="Pixan Tech"><span>Pixan Tech<small>CRM</small></span></div>
      <nav id="nav" class="rail-nav"></nav>
      <div class="rail-foot">
        <div class="rail-me">
          <div id="meAvatar" class="av"></div>
          <div class="nm"><b id="meName"></b><small id="meLevel"></small></div>
          <button data-act="logout" title="Cerrar sesión" aria-label="Cerrar sesión"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
        </div>
      </div>
    </aside>
    <div id="railScrim"></div>

    <main id="main">
      <header class="glass topbar">
        <button class="icon-btn" data-act="railToggle" id="railBtn" title="Menú" aria-label="Mostrar u ocultar el menú"></button>
        <div class="min-w-0">
          <h2 id="viewTitle" class="truncate"></h2>
          <p id="viewSub" class="truncate"></p>
        </div>
        <div class="ml-auto flex items-center gap-2">
          <span id="syncInfo" class="hidden md:inline text-xs muted"></span>
          <button class="icon-btn hide-xs" data-act="refresh" title="Actualizar datos" aria-label="Actualizar datos"><i class="fa-solid fa-rotate"></i></button>
          <button class="icon-btn" data-act="theme" id="themeBtn" title="Cambiar tema" aria-label="Cambiar tema"></button>
          <button class="icon-btn" data-act="go" data-v="dashboard" id="bellBtn" title="Avisos" aria-label="Avisos" hidden></button>
        </div>
      </header>
      <div id="view"></div>
    </main>
  </div>

  <div id="scrim" class="scrim"></div>
  <aside id="drawer" class="drawer glass" aria-modal="true" role="dialog"></aside>
  <div id="modalRoot"></div>
  <div id="toasts" class="toast-wrap" aria-live="polite"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/cobros-calc.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/core.js"></script>
  <script src="js/team.js"></script>
  <script src="js/image.js"></script>
  <script src="js/lead-drawer.js"></script>
  <script src="js/views-panel.js"></script>
  <script src="js/views-leads.js"></script>
  <script src="js/views-agenda.js"></script>
  <script src="js/views-cobros.js"></script>
  <script src="js/views-comisiones.js"></script>
  <script src="js/views-perdidos.js"></script>
  <script src="js/views-import.js"></script>
  <script src="js/views-admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
