      const ta = $('#dNote');
      const texto = ta.value.trim();
      if (!texto) return;
      const fc = $('[data-lf="fechaContacto"]', $('#drawer'));
      const payload = { id: S.cur.id, texto };
      if (fc && fc.value !== (S.cur.fechaContacto || '')) payload.fechaContacto = fc.value;
      UI.busy(el, true, '');
      try {
        const r = await Api.call('leads.addNote', payload);
        S.cur = r;
        upsertLead(Object.assign({}, r, { notas: r.bitacora.length, bitacora: undefined }));
        Drawer.set(drawerHtml(r)); refreshView();
      } catch (e) { UI.toast(e.message, 'error'); UI.busy(el, false); }
    },
    async sendTpl(el) {
      const tpl = $('#dTpl').value;
      if (!(await UI.confirm('Enviar correo', 'Se enviará la plantilla a ' + S.cur.email + '.', { ok: 'Enviar' }))) return;
      UI.busy(el, true, 'Enviando…');
      try {
        const r = await Api.call('leads.sendEmail', { id: S.cur.id, plantillaId: tpl });
        upsertLead(r); refreshView(); openLead(r.id);
        UI.toast('Correo enviado', 'ok');
      } catch (e) { UI.toast(e.message, 'error'); UI.busy(el, false); }
    },
    async delLead() {
      const l = S.cur;
      if (!(await UI.confirm('Eliminar prospecto', 'Se eliminará "' + l.nombre + '" y su registro de cliente si existe. Esta acción no se puede deshacer.', { danger: true, ok: 'Eliminar' }))) return;
      try {
        await Api.call('leads.delete', { id: l.id });
        S.leads = S.leads.filter((x) => x.id !== l.id);
        S.clientes = S.clientes.filter((c) => c.idLead !== l.id);
        Drawer.close(); refreshView();
        UI.toast('Prospecto eliminado', 'ok');
      } catch (e) { UI.toast(e.message, 'error'); }
    },

    impToggle(el) {
      const k = Number(el.dataset.k);
      S.imp.selected.has(k) ? S.imp.selected.delete(k) : S.imp.selected.add(k);
      $('#impResults').innerHTML = Views.importarResults();
    },
    impHide() { S.imp.hideOff = !S.imp.hideOff; $('#impResults').innerHTML = Views.importarResults(); },
    impAll() {
      const avail = S.imp.rows.filter((r) => !r.duplicado && !r.invalido && !r.importado);
      const all = avail.every((r) => S.imp.selected.has(r._k));
      avail.forEach((r) => (all ? S.imp.selected.delete(r._k) : S.imp.selected.add(r._k)));
      $('#impResults').innerHTML = Views.importarResults();
    },
    impTemplate() { downloadFile('plantilla_prospectos.csv', '﻿' + Csv.TEMPLATE_HEAD + '\r\n'); },
    async impImport(el) {
      const items = S.imp.rows.filter((r) => S.imp.selected.has(r._k) && !r.duplicado && !r.invalido && !r.importado);
      if (!items.length) return;
      const auto = $('#impAuto') && $('#impAuto').checked;
      const msg = 'Se importarán ' + items.length + ' prospectos' + (auto ? ' y se enviará el correo a los que tengan email.' : '.');
      if (!(await UI.confirm(auto ? 'Importar y enviar' : 'Importar prospectos', msg, { ok: auto ? 'Importar y enviar' : 'Importar' }))) return;
      const tpl = auto ? $('#impTpl').value : undefined;
      const d = S.imp.defaults;
      let ins = 0, rej = 0, mails = 0;
      try {
        for (let o = 0; o < items.length; o += 50) {
          const chunk = items.slice(o, o + 50);
          UI.busy(el, true, 'Importando ' + Math.min(o + 50, items.length) + '/' + items.length + '…');
          const r = await Api.call('leads.import', {
            items: chunk.map((x) => ({
              nombre: x.nombre, telefono: x.telefono, web: x.web, colores: x.colores, contacto: x.contacto, email: x.email,
              rubro: x.rubro || d.rubro, pais: x.pais || d.pais, region: x.region || d.region, extras: x.extras,
            })),
            autoEmail: !!auto, plantillaId: tpl, rubro: d.rubro, pais: d.pais, region: d.region, origen: 'csv',
          });
          r.leads.forEach(upsertLead);
          r.resultados.forEach((res) => {
            const it = chunk[res.i];
            if (!it) return;
            if (res.ok) it.importado = true; else { it.duplicado = true; it.motivo = res.motivo; }
          });
          ins += r.insertados; rej += r.rechazados; mails += r.correosEnviados;
        }
        UI.toast(ins + ' importados' + (mails ? ' · ' + mails + ' correos enviados' : '') + (rej ? ' · ' + rej + ' no se importaron por ya existir en el pipeline' : ''), ins ? 'ok' : 'error');
      } catch (e) {
        UI.toast(e.message + (ins ? ' (antes del error se importaron ' + ins + ')' : ''), 'error');
      }
      S.imp.selected = new Set();
      updateSync();
      if (S.view === 'importar') $('#impResults').innerHTML = Views.importarResults();
    },

    cliFiltro: (el) => { const st = Table.state('cli'); st.f.estadoPago = st.f.estadoPago === el.dataset.f ? '' : el.dataset.f; go('clientes'); },
    tSort: (el) => Table.sort(el.dataset.t, el.dataset.k),
    tClear: (el) => { Table.clear(el.dataset.t); if (el.dataset.t === 'cli') go('clientes'); },
    tExport: (el) => Table.exportCsv(el.dataset.t),
    tFilters: (el) => { const b = $("#tF_" + el.dataset.t); if (b) b.classList.toggle("open"); },

    tplSel(el) { S.tplSel = el.dataset.id; $('#tplList').innerHTML = Views.tplList(); $('#tplEditor').innerHTML = Views.tplEditor(); mountQuill(); },
    tplNew() { S.tplSel = '__new'; $('#tplList').innerHTML = Views.tplList(); $('#tplEditor').innerHTML = Views.tplEditor(); mountQuill(); },
    tplVar(el) {
      if (!S.quill) return;
      const r = S.quill.getSelection(true);
      S.quill.insertText(r.index, '{{' + el.dataset.v + '}}', 'user');
      S.quill.setSelection(r.index + el.dataset.v.length + 4);
    },
    async tplSave(el) {
      if (!S.quill) return;
      const payload = {
        id: $('#tplId').value || undefined, nombre: $('#tplNombre').value.trim(), asunto: $('#tplAsunto').value.trim(),
        cuerpoHtml: S.quill.root.innerHTML, activa: $('#tplActiva').checked,
      };
      UI.busy(el, true, 'Guardando…');
      try {
        S.plantillas = await Api.call('plantillas.save', payload);
        if (!payload.id) S.tplSel = (S.plantillas.find((t) => t.nombre === payload.nombre && t.asunto === payload.asunto) || {}).id || null;
        $('#tplList').innerHTML = Views.tplList();
        $('#tplId').value = S.tplSel || '';
        UI.toast('Plantilla guardada', 'ok');
      } catch (e) { UI.toast(e.message, 'error'); }
      UI.busy(el, false);
    },
    async cfgSave(el) {
      const valores = {};
      $$('[data-cfg]').forEach((i) => { valores[i.dataset.cfg] = i.value.trim(); });
      UI.busy(el, true, 'Guardando…');
      try { renderCfg(await Api.call('config.save', { valores })); UI.toast('Ajustes guardados', 'ok'); }
      catch (e) { UI.toast(e.message, 'error'); UI.busy(el, false); }
    },

    userNew: () => userFormModal(),
    usrActivo(el) {
      const u = S.users.find((x) => x.email === el.dataset.email);
      updateUser(u.email, { activo: !u.activo }, u.activo ? 'Usuario desactivado' : 'Usuario activado');
    },
    async usrReset(el) {
      try { await Api.call('users.resetPassword', { email: el.dataset.email }); UI.toast('Correo de restablecimiento enviado', 'ok'); }
      catch (e) { UI.toast(e.message, 'error'); }
    },
    async usrUnlink(el) {
      if (!(await UI.confirm('Desvincular cuenta', 'El perfil se volverá a vincular en su próximo inicio de sesión con el correo verificado. Úsalo si el usuario recreó su cuenta.'))) return;
      updateUser(el.dataset.email, { desvincularUid: true }, 'Cuenta desvinculada');
    },
    async usrDel(el) {
      const email = el.dataset.email;
      if (!(await UI.confirm('Eliminar perfil', 'Se eliminará el acceso de ' + email + ' al CRM.', { danger: true, ok: 'Eliminar' }))) return;
      try {
        await Api.call('users.delete', { email });
        S.users = S.users.filter((u) => u.email !== email);
        renderUsers();
        UI.toast('Perfil eliminado', 'ok');
      } catch (e) { UI.toast(e.message, 'error'); }
    },
  };

  /* ============================== EVENTOS ================================== */
  document.addEventListener('click', (e) => {
    if (e.target.closest('a[href]:not([data-act])')) return; // enlaces externos (WhatsApp, email, web)
    const a = e.target.closest('[data-act]');
    if (a && Actions[a.dataset.act]) { e.preventDefault(); Actions[a.dataset.act](a, e); return; }
    const card = e.target.closest('.lead-card');
    if (card && !e.target.closest('a,button')) openLead(card.dataset.id);
  });
  $('#scrim').addEventListener('click', () => Drawer.close());
  const tableSearch = debounce((t) => { Table.state(t.dataset.tq).q = t.value; Table.body(t.dataset.tq); }, 120);
  document.addEventListener('input', (e) => { if (e.target.dataset && e.target.dataset.tq) tableSearch(e.target); });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    const m = $('#modalRoot').lastElementChild;
    if (m) m.remove(); else if (Drawer.isOpen()) Drawer.close();
  });
  document.addEventListener('change', async (e) => {
    const t = e.target;
    if (t.dataset.tf) { Table.state(t.dataset.tf).f[t.dataset.k] = t.value; Table.body(t.dataset.tf); if (t.dataset.tf === 'cli' && t.dataset.k === 'estadoPago') go('clientes'); return; }
    if (t.id === 'dEstado' && S.cur) { moveLead(S.cur.id, t.value); return; }
    if (t.dataset.cli) {
      const id = t.dataset.cli, f = t.dataset.f;
      try {
        const r = await Api.call('clientes.update', { idLead: id, [f]: t.value });
        const i = S.clientes.findIndex((c) => c.idLead === id);
        if (i >= 0) S.clientes[i] = r;
        if (f === 'estadoPago') t.style.color = PAGO_META[r.estadoPago];
        UI.toast('Cliente actualizado', 'ok');
      } catch (err) { UI.toast(err.message, 'error'); }
      return;
    }
    if (t.dataset.usr) updateUser(t.dataset.usr, { [t.dataset.f]: t.value }, 'Nivel actualizado');
  });

  /* ================================= APP =================================== */
  const App = {
    /** Cierra sesión y vuelve al login sin depender de que Firebase notifique el cambio. */
    async logout() {
      $('#boot').hidden = false; $('#app').hidden = true; $('#bootMsg').textContent = 'Cerrando sesión…';
      try { await Promise.race([Auth.logout(), new Promise((r) => setTimeout(r, 4000))]); } catch (e) { /* se limpia igual */ }
      Object.assign(S, { user: null, leads: [], clientes: [], plantillas: [], usuariosAsignables: [], cur: null, users: null, niveles: null, quill: null });
      S.imp = Object.assign({}, S.imp, { rows: [], selected: new Set(), file: '', error: '', extraLabels: [], truncated: false, open: false });
      $('#modalRoot').innerHTML = '';
      $('#view').innerHTML = '';
      $('#lgPass').value = '';
      $('#lgMsg').hidden = true;
      App.showLogin();
    },
    showLogin(msg) {
      $('#boot').hidden = true; $('#app').hidden = true; $('#login').hidden = false;
      $('#loginForm').hidden = false; $('#gate').hidden = true;
      Drawer.close();
      if (msg) showLoginMsg(msg, 'error');
    },
    showGate(err) {
      $('#boot').hidden = true; $('#app').hidden = true; $('#login').hidden = false;
      $('#loginForm').hidden = true; $('#gate').hidden = false;
      const g = $('#gateMsg');
      g.textContent = err.message;
      g.style.background = 'rgba(239,68,68,.1)'; g.style.color = '#e11d48';
      $('#gateVerify').hidden = err.code !== 'EMAIL_NOT_VERIFIED';
    },
    async start() {
      $('#login').hidden = true; $('#boot').hidden = false; $('#bootMsg').textContent = 'Cargando tu espacio…';
      try {
        await App.load(true);
        $('#boot').hidden = true; $('#app').hidden = false;
        const me = S.user;
        $('#meAvatar').textContent = initials(me.nombre || me.email);
        $('#meName').textContent = me.nombre || me.email;
        $('#meLevel').textContent = me.nivel + ' · ' + me.email;
        go(store.get('pxt-view') || 'dashboard');
      } catch (e) {
        if (['FORBIDDEN', 'EMAIL_NOT_VERIFIED', 'NOT_SETUP'].includes(e.code)) App.showGate(e);
        else App.showGate(Object.assign(new Error(e.message || 'No se pudo cargar el CRM.'), { code: e.code }));
      }
    },
    async load(first) {
      try {
        const d = await Api.call('auth.bootstrap');
        Object.assign(S, {
          user: d.user, estados: d.estados, estadosPago: d.estadosPago, hoy: d.hoy, leads: d.leads,
          clientes: d.clientes, plantillas: d.plantillas, usuariosAsignables: d.usuariosAsignables, loadedAt: Date.now(),
        });
        if (!first) { refreshView(); if (S.view !== 'pipeline' && S.view !== 'dashboard' && S.view !== 'clientes') go(S.view); UI.toast('Datos actualizados', 'ok'); }
        updateSync();
      } catch (e) {
        if (first) throw e;
        UI.toast(e.message, 'error');
      }
    },
  };

  function showLoginMsg(text, type) {
    const b = $('#lgMsg');
    b.hidden = false;
    b.textContent = text;
    b.style.background = type === 'ok' ? 'rgba(16,185,129,.12)' : 'rgba(239,68,68,.1)';
    b.style.color = type === 'ok' ? '#059669' : '#e11d48';
  }

  $('#loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    UI.busy($('#lgBtn'), true, 'Ingresando…');
    try {
      await Auth.login($('#lgEmail').value.trim(), $('#lgPass').value);
    } catch (err) {
      showLoginMsg(Auth.message(err), 'error');
    }
    UI.busy($('#lgBtn'), false);
  });
  $('#lgShow').addEventListener('click', () => {
    const p = $('#lgPass');
    p.type = p.type === 'password' ? 'text' : 'password';
    $('#lgShow i').className = p.type === 'password' ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
  });
  $('#lgForgot').addEventListener('click', async () => {
    const email = $('#lgEmail').value.trim();
    if (!email) { showLoginMsg('Escribe tu email arriba y vuelve a pulsar aquí.', 'error'); return; }
    try { await Auth.reset(email); } catch (err) { /* no revelar si el email existe */ }
    showLoginMsg('Si el email está registrado, recibirás un enlace para restablecer tu contraseña.', 'ok');
  });
  $('#gateOut').addEventListener('click', () => App.logout());
  $('#gateRetry').addEventListener('click', async () => {
    const u = Auth.fb.currentUser;
    if (!u) { App.showLogin(); return; }
    try { await u.reload(); await u.getIdToken(true); } catch (e) { /* se reintenta igual */ }
    App.start();
  });
  $('#gateVerify').addEventListener('click', async (e) => {
    try { await Auth.verify(); UI.toast('Te enviamos el correo de verificación. Después pulsa "Reintentar".', 'ok'); e.target.disabled = true; }
    catch (err) { UI.toast(Auth.message(err), 'error'); }
  });

  // Arranque
  if (store.get('pxt-theme') === 'dark' || (!store.get('pxt-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
  DnD.init();
  Auth.init();
  // Refresco silencioso cada 5 min si la pestaña está visible (sin interrumpir edición).
  setInterval(() => { if (S.user && document.visibilityState === 'visible' && !Drawer.isOpen() && !$('#modalRoot').children.length) Api.call('auth.bootstrap').then((d) => { Object.assign(S, { leads: d.leads, clientes: d.clientes, plantillas: d.plantillas, hoy: d.hoy, loadedAt: Date.now() }); refreshView(); }).catch(() => {}); }, 300000);
  </script>
</body>
</html>
